# MediaTek's kernel protection module (mkp.ko, from the stock vendor_boot)
# tracks credentials in a table sized for Android's pid_max of 32768. With a
# larger pid_max the first process whose PID exceeds 32768 triggers
#   MKP: MKP_ERR: pid is overflow
#   Kernel panic - not syncing: mkp action warning exceeds threshold for policy:4
# and the phone reboots. Keep Android's limit. This file must sort after
# 90-override.conf, which raises pid_max to 65535 for AppSupport.
kernel.pid_max = 32768
