[BatteryUDevDeviceBlacklist]
# degas: "usb" keeps PRESENT=1 with the cable unplugged (only ONLINE drops),
# which left the charger state stuck at "on". "primary_chg" reports the
# cable correctly and is used instead.
usb=true
cw-bat=true
mtk-master-charger=true
mtk-slave-charger=true
mtk-gauge=true
mtk-mst-div-chg=true
mtk-slv-div-chg=true
