# ofono binder driver configuration for MTK devices

[Settings]
Device=/dev/binder
InterfaceType = aidl
# degas has two physical SIM slots (AIDL /ril_0 and /ril_1). slot2 is
# added by binder.d/dual-sim.conf (ExpectSlots+=slot2); listing it here as
# well makes ofono create it twice and crash.
ExpectSlots = slot1
3GLTEHandover = false
MaxNonDataMode = none

emptyPinQuery = false
useDataProfiles = true
mmsDataProfileId = 1001
# RIL_REQUEST_HANGUP_WAITING_OR_BACKGROUND
rilRequestOnSetUdub = 13
extPlugin = mtk
signalStrengthRange=-113,-51

[slot1]
path = /ril_0
slot = 0

[slot2]
path = /ril_1
slot = 1
