# Haptics for the Xiaomi 14T (degas).
#
# The vibrator is an input force feedback device (awinic_haptic, aw86927).
# Its driver plays FF_CONSTANT effects; FF_RUMBLE is converted to FF_PERIODIC
# by the input core and then rejected (the driver expects a vendor custom
# waveform there). The stock ffmemless settings use rumble and periodic
# effects, which must all load or the plugin stops, so every effect is
# redefined as a constant one. cache_effects uploads an effect when it is
# played instead of keeping all of them loaded in the driver.

[ffmemless]
cache_effects = true
supported_effects = touch;touch_weak;touch_strong;release;release_weak;release_strong;drag_start;drag_fail;drag_boundary;drag_end;short;strong;long;notice;message;attention;alarm;ringtone

touch_TYPE = constant
touch_DURATION = 25
touch_LEVEL = 32767

touch_weak_TYPE = constant
touch_weak_DURATION = 18
touch_weak_LEVEL = 24000

touch_strong_TYPE = constant
touch_strong_DURATION = 35
touch_strong_LEVEL = 32767

release_TYPE = constant
release_DURATION = 18
release_LEVEL = 28000

release_weak_TYPE = constant
release_weak_DURATION = 14
release_weak_LEVEL = 20000

release_strong_TYPE = constant
release_strong_DURATION = 24
release_strong_LEVEL = 32767

drag_start_TYPE = constant
drag_start_DURATION = 18
drag_start_LEVEL = 24000

drag_fail_TYPE = constant
drag_fail_DURATION = 30
drag_fail_LEVEL = 32767

drag_boundary_TYPE = constant
drag_boundary_DURATION = 25
drag_boundary_LEVEL = 28000

drag_end_TYPE = constant
drag_end_DURATION = 30
drag_end_LEVEL = 32767

short_TYPE = constant
short_DURATION = 90
short_LEVEL = 32767

strong_TYPE = constant
strong_DURATION = 140
strong_LEVEL = 32767

long_TYPE = constant
long_DURATION = 600
long_LEVEL = 32767

notice_TYPE = constant
notice_DURATION = 120
notice_REPEAT = 2
notice_DELAY = 500
notice_LEVEL = 32767

message_TYPE = constant
message_DURATION = 240
message_REPEAT = 2
message_DELAY = 140
message_LEVEL = 32767

attention_TYPE = constant
attention_DURATION = 100
attention_REPEAT = 3
attention_DELAY = 100
attention_LEVEL = 32767

alarm_TYPE = constant
alarm_DURATION = 1000
alarm_DELAY = 500
alarm_LEVEL = 32767

ringtone_TYPE = constant
ringtone_DURATION = 1500
ringtone_DELAY = 500
ringtone_LEVEL = 32767
