# See /usr/bin/droid/nv-copies.sh. oneshot so that ExecStartPost runs after
# mount-android.sh has finished, before droid-hal-init starts the container.
[Unit]
RequiresMountsFor=/userdata

[Service]
Type=oneshot
ExecStartPre=/usr/bin/droid/nv-copies.sh prepare
ExecStartPost=/usr/bin/droid/nv-copies.sh remount
